<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis Mini Proyectos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;

background:#111827;

color:white;

padding:40px;

}

h1{

margin-bottom:35px;

font-size:40px;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(320px,1fr));

gap:25px;

}

.card{

background:#1f2937;

border-radius:12px;

overflow:hidden;

text-decoration:none;

color:white;

transition:.25s;

box-shadow:0 5px 20px rgba(0,0,0,.2);

}

.card:hover{

transform:translateY(-6px);

box-shadow:0 15px 30px rgba(0,0,0,.4);

}

.card img{

width:100%;

aspect-ratio:16/9;

object-fit:cover;

display:block;

}

.info{

padding:18px;

}

.info h2{

font-size:22px;

}

</style>

</head>

<body>

<h1>🚀 Mis Mini Proyectos</h1>

<div class="grid">



<a class="card" href="./cafe/">

    <img
        src="cafe/preview.webp"
        alt="Cafe"
        loading="lazy">

    <div class="info">

        <h2>Cafe</h2>

    </div>

</a>



<a class="card" href="./chocolates/">

    <img
        src="chocolates/preview.webp"
        alt="Chocolates"
        loading="lazy">

    <div class="info">

        <h2>Chocolates</h2>

    </div>

</a>



<a class="card" href="./salsa/">

    <img
        src="salsa/preview.webp"
        alt="Salsa"
        loading="lazy">

    <div class="info">

        <h2>Salsa</h2>

    </div>

</a>



<a class="card" href="./salsa_topa/">

    <img
        src="salsa_topa/preview.webp"
        alt="Salsa Topa"
        loading="lazy">

    <div class="info">

        <h2>Salsa Topa</h2>

    </div>

</a>



</div>

</body>

</html>
