<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una sorpresa para ti 🌸</title>
    <!-- Tailwind CSS y Google Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        
        /* Animaciones personalizadas de transición */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animación de caída de pétalos de flores */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .petal {
            position: fixed;
            top: -10vh;
            z-index: 99;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }
    </style>
</head>
<body class="bg-[#faf6f2] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Elementos decorativos de fondo estilo botánico -->
    <div class="absolute top-10 left-10 w-48 h-48 bg-amber-100/50 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-64 h-64 bg-rose-100/40 rounded-full blur-3xl pointer-events-none"></div>

    <div id="app" class="w-full max-w-md bg-white/95 backdrop-blur-md border border-amber-900/10 rounded-3xl p-8 shadow-xl text-center relative z-10">
        <!-- Contenido dinámico -->
    </div>

    <script>
        const botanicalImages = [
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop&q=80", // Flores sutiles
            "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=400&auto=format&fit=crop&q=80", // Ramos estéticos
            "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=400&auto=format&fit=crop&q=80"  // Rosas suaves
        ];

        const cutePhrases = [
            "¿Estás segura? Piensa en las flores 🌷",
            "Mmm... el botón de al lado se ve más feliz",
            "Mi corazoncito botánico sufre 🥀",
            "Ya no te resistas al destino floral ✨",
            "¡Di que sí y te invito un café con pan dulce! ☕"
        ];

        let state = {
            step: 1,
            refusals: 0,
            imgIndex: 0,
            dateSelected: "",
            vibeSelected: ""
        };

        function render() {
            const app = document.getElementById("app");

            if (state.step === 1) {
                const yesScale = 1 + (state.refusals * 0.3);
                const noScale = Math.max(0.35, 1 - (state.refusals * 0.15));
                const textToShow = cutePhrases[Math.min(state.refusals, cutePhrases.length - 1)];

                app.className = "w-full max-w-md bg-white/95 backdrop-blur-md border border-amber-900/10 rounded-3xl p-8 shadow-xl text-center relative z-10 animate-fade-in";
                app.innerHTML = `
                    <div class="w-36 h-36 mx-auto mb-6 rounded-2xl overflow-hidden shadow-md border-2 border-amber-100">
                        <img src="${botanicalImages[state.imgIndex]}" class="w-full h-full object-cover">
                    </div>

                    <span class="text-amber-800/60 text-xs font-semibold tracking-widest uppercase bg-amber-50 px-3 py-1 rounded-full">Invitación especial</span>
                    
                    <h1 class="text-3xl font-serif-custom font-bold text-stone-800 mt-4 mb-2">¿Me concedes una cita? 🌿</h1>
                    <p class="text-stone-500 text-sm mb-8 min-h-[40px]">${state.refusals === 0 ? "Prometo que será un momento inolvidable." : textToShow}</p>

                    <div class="flex items-center justify-center gap-4 flex-wrap">
                        <button onclick="goToStep(2)" style="transform: scale(${yesScale})" class="bg-stone-900 text-white font-semibold px-7 py-3.5 rounded-xl shadow-md hover:bg-stone-800 transition-transform cursor-pointer">
                            Sí, acepto 🌸
                        </button>
                        <button onclick="handleDecline()" style="transform: scale(${noScale})" class="bg-stone-100 text-stone-600 font-medium px-6 py-3.5 rounded-xl hover:bg-stone-200 transition-transform cursor-pointer">
                            No
                        </button>
                    </div>
                `;
            } else if (state.step === 2) {
                app.className = "w-full max-w-md bg-white/95 backdrop-blur-md border border-amber-900/10 rounded-3xl p-8 shadow-xl text-center relative z-10 animate-fade-in";
                app.innerHTML = `
                    <h2 class="text-2xl font-serif-custom font-bold text-stone-800 mb-1">¿Qué día nos vemos? 🗓️</h2>
                    <p class="text-stone-500 text-sm mb-6">Elige la fecha perfecta en el calendario</p>

                    <input type="date" class="w-full p-3.5 rounded-xl border border-stone-200 mb-5 bg-stone-50 text-stone-700 font-medium focus:outline-none focus:ring-2 focus:ring-amber-800/30" onchange="state.dateSelected=this.value">

                    <div class="grid grid-cols-2 gap-2 mb-6">
                        <button onclick="pickDate('Este fin de semana')" class="p-3 text-xs font-semibold bg-stone-50 border border-stone-200/60 rounded-xl hover:bg-amber-50 text-stone-700 transition-all cursor-pointer">✨ Este fin de semana</button>
                        <button onclick="pickDate('Pronto, tú avísame')" class="p-3 text-xs font-semibold bg-stone-50 border border-stone-200/60 rounded-xl hover:bg-amber-50 text-stone-700 transition-all cursor-pointer">🕊️ Pronto, tú avísame</button>
                    </div>

                    <button onclick="if(state.dateSelected) goToStep(3)" class="w-full bg-stone-900 text-white font-semibold py-3.5 rounded-xl shadow-md hover:bg-stone-800 cursor-pointer">Continuar ➔</button>
                `;
            } else if (state.step === 3) {
                app.className = "w-full max-w-md bg-white/95 backdrop-blur-md border border-amber-900/10 rounded-3xl p-8 shadow-xl text-center relative z-10 animate-fade-in";
                app.innerHTML = `
                    <h2 class="text-2xl font-serif-custom font-bold text-stone-800 mb-1">¿Cuál será el ambiente? ☕</h2>
                    <p class="text-stone-500 text-sm mb-6">Selecciona el plan ideal</p>

                    <div class="grid grid-cols-1 gap-3 mb-6">
                        <div onclick="pickVibe('Café bohemio y charlas largas ☕')" class="p-4 bg-stone-50 border border-stone-200/60 rounded-2xl cursor-pointer hover:border-amber-800/40 hover:bg-amber-50/40 transition-all text-left flex items-center gap-3">
                            <span class="text-2xl">☕</span>
                            <div>
                                <p class="font-bold text-stone-800 text-sm">Café bohemio</p>
                                <p class="text-xs text-stone-500">Charlas tranquilas y buen ambiente</p>
                            </div>
                        </div>
                        <div onclick="pickVibe('Picnic al aire libre 🧺')" class="p-4 bg-stone-50 border border-stone-200/60 rounded-2xl cursor-pointer hover:border-amber-800/40 hover:bg-amber-50/40 transition-all text-left flex items-center gap-3">
                            <span class="text-2xl">🧺</span>
                            <div>
                                <p class="font-bold text-stone-800 text-sm">Picnic al aire libre</p>
                                <p class="text-xs text-stone-500">Naturaleza, merienda y buena compañía</p>
                            </div>
                        </div>
                        <div onclick="pickVibe('Librería y postre 🍰')" class="p-4 bg-stone-50 border border-stone-200/60 rounded-2xl cursor-pointer hover:border-amber-800/40 hover:bg-amber-50/40 transition-all text-left flex items-center gap-3">
                            <span class="text-2xl">🍰</span>
                            <div>
                                <p class="font-bold text-stone-800 text-sm">Librería y postre</p>
                                <p class="text-xs text-stone-500">Explorar libros y comer algo dulce</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.step === 4) {
                app.className = "w-full max-w-md bg-white/95 backdrop-blur-md border border-amber-900/10 rounded-3xl p-8 shadow-xl text-center relative z-10 animate-fade-in";
                app.innerHTML = `
                    <div class="w-32 h-32 mx-auto mb-5 rounded-full overflow-hidden shadow-md border-2 border-amber-100">
                        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&auto=format&fit=crop&q=80" class="w-full h-full object-cover">
                    </div>

                    <h2 class="text-2xl font-serif-custom font-bold text-stone-800 mb-1">Cita confirmada 🌸</h2>
                    <p class="text-stone-500 text-xs mb-6">Ya tengo todo agendado en mi mente</p>

                    <div class="bg-amber-50/60 border border-amber-900/10 rounded-2xl p-4 mb-6 text-left space-y-2 text-sm text-stone-700">
                        <p>📅 <strong>Cuándo:</strong> ${state.dateSelected}</p>
                        <p>🌿 <strong>Plan:</strong> ${state.vibeSelected}</p>
                    </div>

                    <p class="text-xs text-amber-900/70 font-medium italic">"Nos vemos pronto. No acepto cancelaciones. 🤍"</p>
                `;
                
                // Disparar la lluvia de pétalos personalizada
                startFlowerRain();
            }
        }

        function handleDecline() {
            state.refusals++;
            state.imgIndex = (state.imgIndex + 1) % botanicalImages.length;
            render();
        }

        function goToStep(s) { state.step = s; render(); }
        function pickDate(d) { state.dateSelected = d; goToStep(3); }
        function pickVibe(v) { state.vibeSelected = v; goToStep(4); }

        // Función personalizada para crear la lluvia de pétalos de flores
        function startFlowerRain() {
            const symbols = ["🌸", "💮", "🌷", "🌹", "✨", "🍃"];
            for (let i = 0; i < 35; i++) {
                const petal = document.createElement("div");
                petal.className = "petal";
                petal.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                petal.style.left = Math.random() * 100 + "vw";
                petal.style.animationDuration = (Math.random() * 3 + 2) + "s";
                petal.style.animationDelay = (Math.random() * 2) + "s";
                petal.style.fontSize = (Math.random() * 14 + 14) + "px";
                document.body.appendChild(petal);

                // Eliminar del DOM al terminar la animación para no saturar memoria
                setTimeout(() => {
                    petal.remove();
                }, 6000);
            }
        }

        render();
    </script>
</body>
</html>
