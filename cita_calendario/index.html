<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ir a una cita? 💕</title>
    <!-- Tailwind CSS y Google Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body class="bg-[#fdf2f8] min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-white/90 backdrop-blur-md border border-pink-100 rounded-2xl p-6 shadow-xl text-center">
        <!-- El contenido cambia dinámicamente con JavaScript -->
    </div>

    <script>
        // Enlaces directos y estables de animales y celebraciones
        const animalGifs = [
            "https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=400&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1534361960057-19889db9621e?w=400&auto=format&fit=crop&q=80"
        ];

        const noButtonTexts = [
            "¿Estás segura?", "¿De verdad??", "Ándale...", 
            "Por favor 🥺", "Me voy a poner triste...", "Muy triste...", 
            "Literalmente estoy llorando rn", "¡Ya di que sí! ❤️"
        ];

        let state = {
            step: 1,
            noCount: 0,
            gifIndex: 0,
            date: "",
            activity: "",
            food: ""
        };

        function render() {
            const app = document.getElementById("app");
            
            if (state.step === 1) {
                const yesScale = 1 + (state.noCount * 0.3);
                const noScale = Math.max(0.3, 1 - (state.noCount * 0.15));
                const currentNoText = noButtonTexts[Math.min(state.noCount, noButtonTexts.length - 1)];

                app.innerHTML = `
                    <div class="w-48 h-48 mx-auto mb-4 rounded-xl overflow-hidden shadow-inner bg-pink-50">
                        <img src="${animalGifs[state.gifIndex]}" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-2xl font-extrabold text-[#d32f2f] mb-2">¿Quieres ir a una cita conmigo? 💕</h1>
                    <p class="text-gray-500 text-sm mb-6">${state.noCount === 0 ? "Elige con sabiduría." : currentNoText}</p>
                    <div class="flex items-center justify-center gap-4 flex-wrap">
                        <button onclick="nextStep(2)" style="transform: scale(${yesScale})" class="bg-[#fa0561] text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition-transform cursor-pointer">
                            ¡Sí! 💕
                        </button>
                        <button onclick="handleNo()" style="transform: scale(${noScale})" class="bg-gray-200 text-gray-700 font-semibold px-6 py-3 rounded-xl shadow transition-transform cursor-pointer">
                            ${currentNoText}
                        </button>
                    </div>
                `;
            } else if (state.step === 2) {
                app.innerHTML = `
                    <h2 class="text-2xl font-extrabold text-[#d32f2f] mb-1">¿Cuándo estás libre?</h2>
                    <p class="text-gray-500 text-sm mb-4">Elige un día 📅</p>
                    <input type="date" id="dateInput" class="w-full p-3 rounded-xl border border-pink-200 mb-4 bg-pink-50/50 text-gray-700" onchange="state.date=this.value">
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button onclick="selectDate('Este Viernes')" class="p-2 text-xs font-semibold bg-white border border-pink-100 rounded-xl hover:bg-pink-50 cursor-pointer">Este Viernes</button>
                        <button onclick="selectDate('Este Fin de Semana')" class="p-2 text-xs font-semibold bg-white border border-pink-100 rounded-xl hover:bg-pink-50 cursor-pointer">Este Fin de Semana</button>
                    </div>
                    <button onclick="if(state.date) nextStep(3)" class="w-full bg-[#fa0561] text-white font-semibold py-3 rounded-xl shadow cursor-pointer">Continuar ✨</button>
                `;
            } else if (state.step === 3) {
                app.innerHTML = `
                    <h2 class="text-2xl font-extrabold text-[#d32f2f] mb-1">¿Qué planeamos?</h2>
                    <p class="text-gray-500 text-sm mb-4">Elige el ambiente ✨</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="selectActivity('🎬 Noche de Cine')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50 text-left font-bold text-sm text-gray-700">🎬 Noche de Cine</div>
                        <div onclick="selectActivity('🌳 Caminata')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50 text-left font-bold text-sm text-gray-700">🌳 Caminata</div>
                        <div onclick="selectActivity('👩‍🍳 Cocinar Juntos')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50 text-left font-bold text-sm text-gray-700">👩‍🍳 Cocinar Juntos</div>
                        <div onclick="selectActivity('🌌 Ver Estrellas')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50 text-left font-bold text-sm text-gray-700">🌌 Ver Estrellas</div>
                    </div>
                `;
            } else if (state.step === 4) {
                app.innerHTML = `
                    <h2 class="text-2xl font-extrabold text-[#d32f2f] mb-1">¿Qué vamos a comer?</h2>
                    <p class="text-gray-500 text-sm mb-4">🍽️</p>
                    <div class="grid grid-cols-3 gap-3">
                        <div onclick="selectFood('🍣 Sushi')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50"><span class="text-2xl">🍣</span><p class="text-xs font-semibold text-gray-700">Sushi</p></div>
                        <div onclick="selectFood('🍕 Pizza')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50"><span class="text-2xl">🍕</span><p class="text-xs font-semibold text-gray-700">Pizza</p></div>
                        <div onclick="selectFood('🍜 Ramen')" class="p-3 border border-pink-100 rounded-xl cursor-pointer hover:bg-pink-50"><span class="text-2xl">🍜</span><p class="text-xs font-semibold text-gray-700">Ramen</p></div>
                    </div>
                `;
            } else if (state.step === 5) {
                app.innerHTML = `
                    <div class="w-32 h-32 mx-auto mb-4 rounded-full overflow-hidden shadow-md bg-pink-50">
                        <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?w=400&auto=format&fit=crop&q=80" class="w-full h-full object-cover">
                    </div>
                    <h2 class="text-2xl font-extrabold text-[#d32f2f] mb-1">¡Es una cita! 💕</h2>
                    <div class="bg-pink-50 border border-pink-100 rounded-xl p-4 mb-4 text-left space-y-1 text-sm text-gray-700">
                        <p>📅 <strong>Fecha:</strong> ${state.date}</p>
                        <p>🎯 <strong>Actividad:</strong> ${state.activity}</p>
                        <p>🍽️ <strong>Comida:</strong> ${state.food}</p>
                    </div>
                    <p class="text-xs text-gray-500 italic">"Prepárate. Voy por ti. No hay devoluciones. 💕"</p>
                `;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function handleNo() {
            state.noCount++;
            state.gifIndex = (state.gifIndex + 1) % animalGifs.length;
            render();
        }

        function nextStep(s) { state.step = s; render(); }
        function selectDate(d) { state.date = d; nextStep(3); }
        function selectActivity(a) { state.activity = a; nextStep(4); }
        function selectFood(f) { state.food = f; nextStep(5); }

        render();
    </script>
</body>
</html>
